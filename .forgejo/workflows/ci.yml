name: build-and-test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: homelab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            glslc pkg-config curl zip unzip tar ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake --preset default \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
