name: build-and-test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: homelab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Add LunarG Vulkan SDK repository
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | \
            sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            http://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list

      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            vulkan-sdk pkg-config curl zip unzip tar ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/visioncpp-src
          key: fetchcontent-visioncpp-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake --preset default \
            -DFETCHCONTENT_QUIET=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

