name: build-and-test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Build and test
    runs-on: homelab
    container:
      image: debian:trixie
    steps:
      - name: Install git and Node.js
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev vulkan-validationlayers glslang-tools glslc \
            breeze plasma-integration qt6-wayland \
            pkg-config curl zip unzip tar ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json') }}

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/visioncpp-src
          key: fetchcontent-visioncpp-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake --preset default \
            -DFETCHCONTENT_QUIET=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
