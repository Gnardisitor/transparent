name: Release

on:
  release:
    types: [published]

jobs:
  build_appimage:
    name: Build and publish AppImage
    runs-on: homelab
    container:
      image: debian:trixie
    steps:
      - name: Install git and Node.js
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update && apt-get install -y \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libvulkan-dev vulkan-validationlayers glslang-tools glslc \
            breeze plasma-integration qt6-wayland \
            pkg-config curl zip unzip tar ccache file zsync

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ hashFiles('vcpkg.json') }}

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps/visioncpp-src
          key: fetchcontent-visioncpp-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: |
          cmake --preset default \
            -DFETCHCONTENT_QUIET=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build AppImage
        run: packaging/build-appimage.sh
        env:
          # Embedded so AppImageUpdate / Gear Lever can check for updates.
          # Forgejo resolves /releases/download/latest/ to the newest release.
          APPIMAGE_UPDATE_INFO: >-
            zsync|${{ github.server_url }}/${{ github.repository }}/releases/download/latest/Transparent-x86_64.AppImage.zsync

      - name: Prepare release assets
        run: |
          mkdir -p dist
          # Versioned AppImage is the human-facing download
          cp build/Transparent-*.AppImage \
            "dist/Transparent-${{ github.event.release.tag_name }}-x86_64.AppImage"
          # The zsync keeps a stable name so the URL embedded in the AppImage
          # stays valid across releases; its target URL is rewritten to point
          # at this release's versioned AppImage each time (same scheme as Eden)
          # -o is required: without it zsyncmake writes <basename>.zsync into
          # the current directory, not next to the input file
          zsyncmake -u "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/Transparent-${{ github.event.release.tag_name }}-x86_64.AppImage" \
            -o "dist/Transparent-${{ github.event.release.tag_name }}-x86_64.AppImage.zsync" \
            "dist/Transparent-${{ github.event.release.tag_name }}-x86_64.AppImage"
          mv "dist/Transparent-${{ github.event.release.tag_name }}-x86_64.AppImage.zsync" \
            dist/Transparent-x86_64.AppImage.zsync
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload Release Assets
        uses: actions/forgejo-release@v2.13.4
        with:
          direction: upload
          repo: ${{ github.repository }}
          token: ${{ secrets.TOKEN }}
          tag: ${{ github.event.release.tag_name }}
          release-dir: dist
          override: true
