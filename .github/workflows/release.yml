# Release pipeline for the GitHub mirror for multi-platform builds.
# Canonical CI/CD lives on the project's Forgejo (.forgejo/workflows).
name: Release

on:
  push:
    tags: '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (e.g. 0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag and project version
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"

          # Only build latest tag
          latest="$(git tag --list '*.*.*' --sort=-v:refname | head -n1)"
          if [[ "${tag}" != "${latest}" ]]; then
            echo "Tag ${tag} is not the newest (${latest}); skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Make sure tag matches CMake project version
          cmake_version="$(sed -n 's/^project(transparent VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "${tag}" != "${cmake_version}" ]]; then
            echo "::error::Tag ${tag} does not match CMakeLists.txt version ${cmake_version}. Bump project(VERSION) and re-tag."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux AppImage
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential cmake ninja-build qt6-base-dev qt6-base-dev-tools libvulkan-dev glslang-tools glslc \
            breeze plasma-integration qt6-wayland pkg-config curl zip unzip tar ccache file zsync

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake --preset default -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Build AppImage
        run: packaging/build-appimage.sh
        env:
          APPIMAGE_VERSION: ${{ env.TAG }}
          APPIMAGE_UPDATE_INFO: zsync|https://github.com/${{ github.repository }}/releases/latest/download/Transparent-x86_64.AppImage.zsync

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/Transparent-*.AppImage "dist/Transparent-${TAG}-x86_64.AppImage"
          zsyncmake -u "https://github.com/${{ github.repository }}/releases/download/${TAG}/Transparent-${TAG}-x86_64.AppImage" \
            -o "dist/Transparent-${TAG}-x86_64.AppImage.zsync" "dist/Transparent-${TAG}-x86_64.AppImage"
          mv "dist/Transparent-${TAG}-x86_64.AppImage.zsync" dist/Transparent-x86_64.AppImage.zsync

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  windows:
    name: Windows Installer
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Enable long paths
        run: git config --global core.longpaths true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: C:\Qt
          key: qt-6.8.3-windows-msvc2022_64

      - name: Install Qt 6.8.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt
      - name: Put Qt on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Qt\6.8.3\msvc2022_64\bin"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        id: vulkan-sdk-cache
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-1.4.357.0-windows

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Downloading Vulkan SDK 1.4.357.0"
          curl.exe --fail --retry 3 -L -o "$env:RUNNER_TEMP\vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkan-sdk.exe"
          if (-not (Test-Path "$env:RUNNER_TEMP\vulkan-sdk.exe")) { throw "SDK download failed" }
          Write-Host "Installing (silent, takes a few minutes)..."
          Start-Process -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -ArgumentList "/S" -Wait
          if (-not (Test-Path "C:\VulkanSDK")) { throw "SDK installer ran but C:\VulkanSDK was not created" }
          Write-Host "Vulkan SDK installed"

      - name: Put Vulkan SDK on PATH
        shell: pwsh
        run: |
          $sdk = (Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Add-Content $env:GITHUB_ENV "PATH=$sdk\Bin;$env:PATH"

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg\downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Build and run tests
        shell: pwsh
        run: |
          cmake --preset windows
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build installer
        shell: pwsh
        run: powershell -File packaging\build-installer.ps1

      - name: Rename installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item "build\dist\Transparent-*-x64-setup.exe" "dist\Transparent-${{ env.TAG }}-windows-x64-setup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  macos:
    name: macOS DMG
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: macos-15
    env:
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install MoltenVK and shaderc
        run: brew install molten-vk shaderc

      - name: Cache Qt
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ~/qt
          key: qt-6.8.3-macos-clang_64

      - name: Install Qt 6.8.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt mac desktop 6.8.3 clang_64 -O "$HOME/qt"
      - name: Put Qt on PATH
        run: echo "$HOME/qt/6.8.3/macos/bin" >> "$GITHUB_PATH"

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-archives-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-archives-${{ runner.os }}-

      - name: Build bundle, tests and DMG
        run: ./packaging/build-macos.sh
        env:
          APPIMAGE_VERSION: ${{ env.TAG }}

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: build/dist/*

  release:
    name: Publish Release
    needs: [guard, linux, windows, macos]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.guard.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          find dist -type f -exec mv {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create release
        run: gh release create "$TAG" --title "Transparent $TAG" --notes "" release/*
